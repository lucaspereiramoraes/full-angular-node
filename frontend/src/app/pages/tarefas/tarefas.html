<div style="max-width: 500px; margin: 0 auto;">
  <h1>Lista de Tarefas ✅</h1>
  <div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <input [value]="novaTarefa" (input)="novaTarefa = $any($event.target).value" placeholder="Nova tarefa..." style="flex: 1; padding: 10px;" (keydown.enter)="adicionarTarefa()">
    <button (click)="adicionarTarefa()" style="padding: 10px 20px;">Add</button>
  </div>
  <ul style="list-style: none; padding: 0;">
    @for (tarefa of tarefas; track tarefa.id) {
      <li style="background: #f5f5f5; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border-radius: 8px; opacity: {{ tarefa.concluida? '0.6' : '1' }};">
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" [checked]="tarefa.concluida" (change)="toggleConcluida(tarefa)">
          <span style="text-decoration: {{ tarefa.concluida? 'line-through' : 'none' }};">{{ tarefa.texto }}</span>
        </div>
        <button (click)="removerTarefa(tarefa.id)" style="background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">X</button>
      </li>
    } @empty {
      <li style="text-align: center; color: #999;">Nenhuma tarefa</li>
    }
  </ul>
  <p>{{ tarefas.length }} tarefas - {{ tarefas.filter(t => t.concluida).length }} concluídas</p>
</div>
